name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable, wasm32 target)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Build intentree.wasm
        run: bash scripts/build-wasm.sh
      - name: Assemble the site
        run: |
          mkdir -p _site/examples _site/web
          cp index.html _site/
          cp -r examples/messenger _site/examples/messenger
          cp -r examples/parking _site/examples/parking
          cp web/intentree.js web/shell.js web/shell.css web/intentree.wasm _site/web/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
